name: Nasadiť web na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Načítať zdrojový kód
        uses: actions/checkout@v4

      - name: Nastaviť pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Nastaviť Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Nainštalovať závislosti
        run: pnpm install --frozen-lockfile

      - name: Vytvoriť statický web
        run: NEXT_PUBLIC_BASE_PATH="/${GITHUB_REPOSITORY#*/}" pnpm build

      - name: Pripraviť GitHub Pages
        uses: actions/configure-pages@v5

      - name: Nahrať statický web
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Nasadiť na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
